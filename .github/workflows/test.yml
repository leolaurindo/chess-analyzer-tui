name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install Stockfish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install Stockfish (macOS)
        if: runner.os == 'macOS'
        run: brew install stockfish
      - name: Run tests
        run: uv run python -m unittest discover -s tests -v
      - name: Build package
        run: uv build
