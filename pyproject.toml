[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer-tui"
version = "0.1.3"
description = "Terminal chess analysis TUI with Stockfish."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/chess-tui-MIT.txt"]
keywords = ["chess", "stockfish", "terminal", "tui", "analysis"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
requires-python = ">=3.11"
dependencies = [
    "chess>=1.11.2",
    "platformdirs>=4.12.3",
    "pyperclip>=1.11.0",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/leolaurindo/chess-analyzer-tui"
Source = "https://github.com/leolaurindo/chess-analyzer-tui"
Issues = "https://github.com/leolaurindo/chess-analyzer-tui/issues"

[project.scripts]
chess-analyzer = "chess_cli:main"

[tool.setuptools]
py-modules = ["chess_cli", "chess_game", "chess_input", "chess_session", "chess_tui", "piece_art"]
packages = ["chess_openings"]

[tool.setuptools.package-data]
chess_openings = ["openings.tsv"]
